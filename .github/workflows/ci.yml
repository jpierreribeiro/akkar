# akkar CI
#
# `docs/BACKLOG.md` recorded CI in the "deliberately not building" table,
# because "the audience is my own use". The audience changed -- see
# `docs/PLAN.md` §1 -- and that decision is retracted with it. Until this file
# existed, nothing but one laptop had ever run the 486 tests.
#
# THE PART THAT IS NOT BOILERPLATE: cqueues is built from a PINNED COMMIT of
# upstream master, not from the published rock. The rock is from July 2020;
# master has six years of fixes on top of it, including Lua 5.5 support and
# LibreSSL compatibility. The project's own docs used to conclude from the
# rock's date that the substrate was abandoned. It is not; only its releases
# are.

name: ci

# ONE RUN PER COMMIT, and this was measured rather than tidied.
#
# `push: ["**"]` together with `pull_request:` ran the ENTIRE matrix twice for
# every commit on a branch with a PR open -- twelve jobs where six answer the
# question, including the four-minute Lua 5.5 stack build twice over.
#
# It was not only waste. On 2026-08-18 commit `ff16765` was run by both, and
# the two disagreed: macOS passed on the push run and failed on the pull
# request run, same tree. Commit `b190384` did it again, with the arm suite
# CANCELLED mid-step on the pull request run while every job on the push run
# went green. A pair of runs that contradict each other on one SHA is worse
# than a slow pipeline: it makes every red ambiguous, and an ambiguous red is
# how a real failure gets waved through as "probably the flake".
#
# So: pull requests are tested, and `main` is tested. A branch with no pull
# request is not, which is the trade -- it is also not going anywhere until it
# has one.
on:
  push:
    branches: [main]
  pull_request:

# And supersede rather than pile up: a second push to the same pull request
# cancels the first run instead of racing it for the same runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Pinned deliberately. Moving it is a decision with a diff, not a drift:
  # `spec/substrate_spec.lua` is what says whether a new one still answers
  # what akkar depends on.
  CQUEUES_COMMIT: c36614982fe07917b2e1ce5a9e7a0e55b81be262

jobs:
  # ---------------------------------------------------------------- unit
  # No services. This job proves the suite is green on a machine with no
  # Postgres and no Redis -- which is the state the skip guards exist for and
  # which nobody had ever verified.
  #
  # AND IT IS THE JOB THAT ANSWERS "WHERE DOES AKKAR RUN".
  #
  # Until this matrix existed, CI was `ubuntu-24.04` and nothing else. ARM64
  # had been measured exactly once, by hand; macOS never. That was tolerable
  # for a library and is not for something calling itself a runtime, because
  # the promise of a runtime IS the combination that works. `docs/UNKNOWNS.md`
  # §1 has carried this as the largest known gap.
  #
  # The other two jobs stay on ubuntu on purpose: `integration` needs service
  # containers, which macOS runners do not have, and `install` is about
  # packaging rather than about platform.
  #
  # macOS is a QUESTION, not an assertion. Nobody has ever built akkar there,
  # so the first runs may well be red -- and a red run that says "luaossl does
  # not build against this OpenSSL" is the finding, not a failure of the CI
  # file. The steps below echo what they resolved before using it, so a break
  # is diagnosable from the log without a second push.
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `include` rather than a cross product: these are the three
        # combinations worth paying for, not every pairing of two lists.
        # macos-14 is Apple Silicon, so it covers macOS and a second arm64.
        include:
          - { os: ubuntu-24.04,     lua: "5.4" }
          - { os: ubuntu-24.04-arm, lua: "5.4" }
          - { os: macos-14,         lua: "5.4" }
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua ${{ matrix.lua }} and build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lua${{ matrix.lua }} liblua${{ matrix.lua }}-dev luarocks \
            libssl-dev build-essential m4 libpq-dev
          {
            echo "LUA_BIN=lua${{ matrix.lua }}"
            echo "LUA_INC=/usr/include/lua${{ matrix.lua }}"
            echo "ROCKS=sudo luarocks"
            echo "LUA_SHARE=/usr/local/share/lua/${{ matrix.lua }}"
            echo "LUA_LIB=/usr/local/lib/lua/${{ matrix.lua }}"
          } >> "$GITHUB_ENV"

      # Homebrew, not apt, and NOT under sudo: brew's luarocks writes inside
      # the brew prefix, which the runner user owns. `sudo luarocks` there
      # resolves a different HOME and a different tree, and installs rocks the
      # test run cannot see.
      # `lua@5.4`, NOT `lua`.
      #
      # The first run of this matrix installed `lua` and the build died on
      #
      #     compat-5.3.h:404: error: "unsupported Lua version
      #                               (i.e. not Lua 5.1, 5.2, 5.3, or 5.4)"
      #
      # because Homebrew's `lua` formula is now **5.5**. The macOS job had
      # accidentally become a Lua 5.5 probe, and it reproduced in CI exactly
      # the blocker `README.md` already documents: cqueues' vendored
      # `lua-compat-5.3` is at v0.9 and stops at 5.4. Nothing about macOS was
      # wrong; the Lua was.
      #
      # `lua@5.4` is keg-only, so nothing is linked into PATH and every path
      # below has to be taken from its own prefix. The version is ASSERTED
      # afterwards, because the whole point is that this went unnoticed once.
      - name: Install Lua ${{ matrix.lua }} and build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install lua@${{ matrix.lua }} luarocks openssl@3 m4 pkg-config libpq

          # Resolved, not assumed. Homebrew's prefix differs between Apple
          # Silicon (/opt/homebrew) and Intel (/usr/local).
          BREW=$(brew --prefix)
          LUA_PREFIX=$(brew --prefix lua@${{ matrix.lua }})
          SSL_PREFIX=$(brew --prefix openssl@3)
          export PKG_CONFIG_PATH="$LUA_PREFIX/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

          INC=$(pkg-config --variable=includedir lua 2>/dev/null || true)
          [ -z "$INC" ] && INC="$LUA_PREFIX/include/lua${{ matrix.lua }}"
          [ -d "$INC" ] || INC="$LUA_PREFIX/include"

          echo "brew prefix    : $BREW"
          echo "lua prefix     : $LUA_PREFIX"
          echo "openssl prefix : $SSL_PREFIX"
          echo "lua headers    : $INC"
          ls "$INC" | head -5

          # THE ASSERTION. A keg-only formula plus a `lua` on PATH that is a
          # different version is exactly how the first run got 5.5 quietly.
          "$LUA_PREFIX/bin/lua" -v
          "$LUA_PREFIX/bin/lua" -e 'assert(_VERSION == "Lua ${{ matrix.lua }}",
            "expected Lua ${{ matrix.lua }}, got " .. _VERSION)'
          grep -q 'LUA_VERSION_NUM.*504' "$INC/lua.h" \
            || { echo "headers are not 5.4"; grep LUA_VERSION_NUM "$INC/lua.h"; exit 1; }

          {
            echo "$LUA_PREFIX/bin"
          } >> "$GITHUB_PATH"
          {
            echo "LUA_BIN=$LUA_PREFIX/bin/lua"
            echo "LUA_INC=$INC"
            echo "ROCKS=luarocks --lua-dir=$LUA_PREFIX"
            echo "LUA_SHARE=$BREW/share/lua/${{ matrix.lua }}"
            echo "LUA_LIB=$BREW/lib/lua/${{ matrix.lua }}"
            echo "OPENSSL_DIR=$SSL_PREFIX"
            echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          } >> "$GITHUB_ENV"

      # The key carries `matrix.os`, not `runner.os`. Both ubuntu runners
      # report `Linux`, so a shared key would have handed the arm64 job an
      # x86-64 build of cqueues -- a cache poisoning that would fail as a
      # confusing link error rather than as a cache problem.
      - name: Cache the cqueues build
        id: cqueues-cache
        uses: actions/cache@v4
        with:
          path: ~/cqueues-build
          key: cqueues-${{ env.CQUEUES_COMMIT }}-lua${{ matrix.lua }}-${{ matrix.os }}

      # OpenSSL has to be pointed at on macOS and does not on Linux, and the
      # difference is not a preference: Homebrew's `openssl@3` is keg-only, so
      # `openssl/ssl.h` is in nobody's default include path. cqueues' makefile
      # does not read `OPENSSL_DIR` -- that is a luarocks convention -- so the
      # directories go in as compiler flags or not at all.
      #
      # This was the second thing the macOS job found, after the Lua version:
      # `socket.c:42: fatal error: 'openssl/ssl.h' file not found`, with
      # `cqueues.c` having compiled cleanly just before it.
      - name: Build cqueues from the pinned commit
        if: steps.cqueues-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/wahern/cqueues.git ~/cqueues-build
          cd ~/cqueues-build
          git checkout "$CQUEUES_COMMIT"

          CPP="-I$LUA_INC"
          LDF=""
          if [ -n "${OPENSSL_DIR:-}" ]; then
            CPP="$CPP -I$OPENSSL_DIR/include"
            LDF="-L$OPENSSL_DIR/lib"
            echo "openssl headers: $OPENSSL_DIR/include"
            ls "$OPENSSL_DIR/include/openssl/ssl.h"
          fi
          make all${{ matrix.lua }} CPPFLAGS="$CPP" LDFLAGS="$LDF"

      # cqueues names these variables WITHOUT the dot -- `lua54path`, not
      # `lua5.4path` (GNUmakefile:43-44, `$(subst .,,$(1))`). We had been
      # passing the dotted spelling, which make happily accepts as a variable
      # nobody reads, so the install silently fell back to `prefix ?=
      # /usr/local`.
      #
      # On Linux that was invisible: /usr/local/{share,lib}/lua/5.4 is exactly
      # where the apt lua5.4 looks anyway, and LUA_SHARE/LUA_LIB were set to
      # those same paths, so the wrong spelling produced the right result. On
      # macOS the fallback tried to mkdir /usr/local/lib without sudo and the
      # accident finally showed up as `Permission denied`.
      #
      # The assertion after it is the point: the file has to be where we said
      # it would be, not merely somewhere.
      # This runs BEFORE the pinned cqueues is installed, and the order is the
      # whole point. `http` depends on cqueues, luarocks has no idea our
      # hand-built one exists, and so it fetches the release rock and says so:
      #
      #     Warning: /usr/local/lib/lua/5.4/_cqueues.so is not tracked by this
      #     installation of LuaRocks. Moving it to .../_cqueues.so~
      #     cqueues 20200726.54-0 is now installed in /usr/local
      #
      # That is the pinned build being deleted by the step after it. It has
      # been happening on Linux since this workflow was written, which means
      # `CQUEUES_COMMIT` has never been what CI tested -- the release tarball
      # was. The pin exists because the vendored HTTP half reaches into
      # cqueues' behaviour, so testing a different cqueues than we pin is the
      # one thing this step must not do.
      #
      # WHY `http` IS STILL INSTALLED HERE, since akkar no longer requires it:
      # the specs use it as an INDEPENDENT CLIENT. `spec/framing_spec.lua` and
      # `spec/fuzz_spec.lua` speak to our server with somebody else's
      # implementation, so a framing bug symmetric between our reader and our
      # writer cannot pass its own tests. It is `test_dependencies` in the
      # rockspec for exactly that reason. It also still drags cqueues in,
      # which is why the pinned build goes in after it.
      - name: Install the rest of the dependencies
        run: |
          # luaossl needs to be pointed at Homebrew's OpenSSL on macOS; on
          # Linux the system one is where its build script already looks.
          EXTRA=""
          [ -n "${OPENSSL_DIR:-}" ] && EXTRA="OPENSSL_DIR=$OPENSSL_DIR CRYPTO_DIR=$OPENSSL_DIR"
          $ROCKS --lua-version ${{ matrix.lua }} install luaossl $EXTRA
          for rock in http lua-cjson pgmoon luasocket busted; do
            $ROCKS --lua-version ${{ matrix.lua }} install "$rock"
          done
          $ROCKS --lua-version ${{ matrix.lua }} install tl || \
            echo "tl unavailable; spec/teal_spec.lua will report pending"

      # ...and the pinned build goes in last, over whatever luarocks left.
      #
      # The destination has to be removed first, and the first attempt at this
      # step is why. `make install` is dependency-driven: the files luarocks
      # just wrote are newer than build objects restored from cache, so make
      # said `Nothing to be done for 'install5.4'` and skipped the copy. The
      # step passed, the release rock stayed, and only the COMMIT assertion
      # below noticed -- which is the entire reason it exists.
      - name: Install the pinned cqueues, last, over the release rock
        run: |
          cd ~/cqueues-build
          SUDO='${{ runner.os == 'Linux' && 'sudo' || '' }}'
          $SUDO rm -f  "$LUA_LIB/_cqueues.so"
          $SUDO rm -rf "$LUA_SHARE/cqueues.lua" "$LUA_SHARE/cqueues"
          NODOT="$(echo '${{ matrix.lua }}' | tr -d .)"
          ${{ runner.os == 'Linux' && 'sudo' || '' }} make install${{ matrix.lua }} \
            "lua${NODOT}path=$LUA_SHARE" \
            "lua${NODOT}cpath=$LUA_LIB"
          test -f "$LUA_LIB/_cqueues.so" \
            || { echo "_cqueues.so is not in $LUA_LIB"; ls -R "$LUA_LIB" || true; exit 1; }
          test -f "$LUA_SHARE/cqueues.lua" \
            || { echo "cqueues.lua is not in $LUA_SHARE"; ls "$LUA_SHARE" || true; exit 1; }

      # Homebrew's luarocks is not run under sudo, so it deploys into the
      # runner's own tree, which nothing searches by default -- that is where
      # `module 'cjson' not found` came from, and `busted` was not on PATH
      # either. Linux needs none of this: `sudo luarocks` deploys into
      # /usr/local, which the apt lua5.4 already searches.
      #
      # The brew prefix goes FIRST, because the rocks tree carries the release
      # copy of cqueues and the pinned build has to win the lookup.
      - name: Put the rocks and the pinned cqueues on the path (macOS)
        if: runner.os == 'macOS'
        run: |
          eval "$($ROCKS --lua-version ${{ matrix.lua }} path)"
          echo "$HOME/.luarocks/bin" >> "$GITHUB_PATH"
          echo "LUA_PATH=$LUA_SHARE/?.lua;$LUA_SHARE/?/init.lua;$LUA_PATH;;" >> "$GITHUB_ENV"
          echo "LUA_CPATH=$LUA_LIB/?.so;$LUA_CPATH;;" >> "$GITHUB_ENV"
          echo "path : $LUA_SHARE/?.lua;$LUA_SHARE/?/init.lua;$LUA_PATH;;"
          echo "cpath: $LUA_LIB/?.so;$LUA_CPATH;;"

      - name: What this platform actually resolved
        run: |
          $LUA_BIN -v
          $LUA_BIN -e 'print("cqueues  " .. (require("cqueues").VERSION or "?"))'
          $LUA_BIN -e 'print("openssl  " .. require("openssl").version())' || true
          $LUA_BIN -e 'print("cjson    " .. (require("cjson")._VERSION or "?"))'

          # The assertion that would have caught the overwrite on day one.
          # `COMMIT` only exists when cqueues is compiled with
          # -DCQUEUES_COMMIT (src/cqueues.c:2955), which our build passes and
          # the release rock does not -- so a missing field means the pinned
          # build lost, and a different value means it lost to something else.
          $LUA_BIN -e '
            local want = os.getenv("CQUEUES_COMMIT")
            local got  = require("cqueues").COMMIT
            print("cqueues from " .. (package.searchpath("cqueues", package.path) or "?"))
            if not got then
              error("cqueues has no COMMIT field: this is the release rock, "
                    .. "not the pinned build")
            end
            assert(got == want, "cqueues is " .. got .. ", pinned is " .. want)
            print("commit   " .. got .. "  (pinned)")'

      # ------------------------------------------------- the C driver
      # 582 LINES OF C THAT NOTHING COMPILED.
      #
      # `src/akkar_pq.c` is hand-written C linked against libpq and shipped as
      # `luarocks install akkar-pq`. Until this step existed, no job in this
      # file mentioned `build.sh`, `libpq`, `pg_config` or `akkar-pq`: the file
      # was not compiled, not linked, not loaded and not syntax-checked, by
      # anything, ever. `spec/pq_spec.lua` opened with
      # `pcall(require, "akkar.pq_native")` and reported one tidy pending, so
      # the suite was the same green whether the driver worked or did not
      # exist -- and the driver was carrying a silent heap-corruption defect
      # (`pq_send_query` pushing one Lua stack slot per parameter with no
      # `lua_checkstack`, against a limit of 65535) that a single compile plus
      # a single test binding more than one parameter would have caught.
      #
      # This job has no Postgres, so what it proves is the half that does not
      # need one: THE C COMPILES, LINKS AND LOADS, on x86_64 and on arm64.
      # `integration` is where it then answers queries. Splitting it that way
      # means an arm64 portability break and a driver logic break arrive as
      # different reds in different jobs.
      #
      # AND IT CHANGES WHAT THE SKIP MEANS. With the module built, both
      # `spec/pq_spec.lua` and the `pq` pass of `spec/db_spec.lua` stop saying
      # "not built" and start saying "no Postgres here" -- which is true, is
      # this job's whole premise, and is a different sentence from the one
      # that hid the gap.
      #
      # NOT `luarocks install akkar-pq`, and not `luarocks install` at all:
      # `akkar-pq-0.1.0-1.rockspec` has `source.url = git+... tag = "v0.1.0"`,
      # so it would fetch and compile the TAGGED RELEASE'S copy of
      # `src/akkar_pq.c` rather than the one in this checkout -- testing the
      # last release on every pull request -- and its `akkar >= 0.1.0`
      # dependency can pull a published `akkar` in over the working tree.
      # `src/build.sh` compiles the file that is actually here, which is the
      # only file this run is about.
      #
      # NO ENVIRONMENT IS PASSED IN, on purpose. `src/build.sh` finds the
      # header through `pg_config --includedir` and the runtime by globbing
      # `/usr/lib/*/libpq.so.5`, and that discovery is itself part of what a
      # clean runner is here to test -- the script is the documented way a
      # user builds this, and a CI invocation that spoon-feeds it every path
      # would leave the documented path untested. If it cannot find libpq it
      # exits non-zero with a message naming the variable to set.
      - name: Build the C Postgres driver (Linux)
        if: runner.os == 'Linux'
        run: bash src/build.sh

      # macOS IS A COMPILE CHECK AND NOT A LOAD, DELIBERATELY.
      #
      # Two separate reasons, and only the first is about macOS:
      #
      #   1. macOS runners have NO SERVICE CONTAINERS, so there is no Postgres
      #      to answer a query here even if the module loaded. Getting one
      #      would mean `brew install postgresql@16` plus `brew services start`
      #      on every macOS leg -- minutes per run -- to re-run coverage the
      #      `integration` job already has. The thing macOS can tell us that
      #      Linux cannot is whether the C is PORTABLE: whether the headers
      #      resolve, whether the Lua API calls are valid, whether clang
      #      objects to what gcc accepted. `-c` answers all three.
      #
      #   2. `src/build.sh` links with `-shared`, which is correct on ELF and
      #      is NOT how a loadable Lua module is linked on Darwin -- that wants
      #      `-bundle -undefined dynamic_lookup`, because the Lua symbols are
      #      resolved by the host interpreter at load time. Making build.sh
      #      branch on `uname -s` is a one-line change and it is NOT MADE HERE,
      #      because nobody in this project has a Mac to run it on and a fix
      #      whose proof is "it looks right" is the thing this repository keeps
      #      finding in its own history. Compiling is verified; linking is
      #      written down as unverified, which is the honest half.
      #
      # `libpq` is keg-only, so its include path is taken from its own prefix
      # rather than assumed to be on the default search path.
      - name: Compile-check the C Postgres driver (macOS)
        if: runner.os == 'macOS'
        run: |
          PQ_PREFIX=$(brew --prefix libpq)
          echo "libpq prefix : $PQ_PREFIX"
          ls "$PQ_PREFIX/include/libpq-fe.h"
          cc -c -O2 -fPIC -Wall -Wextra \
            -I"$LUA_INC" -I"$PQ_PREFIX/include" \
            -o /tmp/akkar_pq.o src/akkar_pq.c
          echo "compiled clean against $(cc --version | head -1)"

      # The build can fail in a way that leaves a stale or unloadable object
      # behind, and the specs would go straight back to the tidy pending that
      # hid all of this. So the module is REQUIRED, not assumed -- and the Lua
      # it was compiled against is checked, because a 5.4 build loads into a
      # 5.5 interpreter without complaint and dumps core on the first real
      # call. `src/akkar_pq.c` exports `LUA_VERSION_NUM` for exactly this.
      - name: The C driver loads, and was built for this Lua
        if: runner.os == 'Linux'
        run: |
          $LUA_BIN -e '
            package.cpath = "./?.so;" .. package.cpath
            local m = assert(require("akkar.pq_native"),
                             "akkar/pq_native.so did not load")
            print("driver   " .. m.VERSION)
            print("built for LUA_VERSION_NUM " .. m.LUA_VERSION_NUM)
            local maj, min = _VERSION:match("Lua (%d+)%.(%d+)")
            local want = tonumber(maj) * 100 + tonumber(min)
            assert(m.LUA_VERSION_NUM == want,
                   ("built for LUA_VERSION_NUM %d, running %s (%d)")
                     :format(m.LUA_VERSION_NUM, _VERSION, want))'

      - name: The suite, with no database and no Redis
        run: |
          set -o pipefail
          busted --output=TAP | tee tap.txt

      # ------------------------------------------- the skip-is-green guard
      # THE BUILD STEP ABOVE CAN SUCCEED AND STILL NOT REACH THE TESTS.
      #
      # `src/build.sh` writes `akkar/pq_native.so`, and the specs find it only
      # because they prepend `./?.so` to `package.cpath` -- a different
      # working directory, a different OUT, a stale object, and the module is
      # missing again while every step in this job stays green. The specs
      # would then report the same tidy pending they reported for the entire
      # life of this file, which is exactly the signal that hid 582 lines of
      # uncompiled C.
      #
      # So the assertion is made against THE TEST RUN rather than the build:
      # this job has no Postgres, so the driver specs must skip -- but they
      # must skip saying "no Postgres here", never "not built". The two
      # sentences are one grep apart and mean completely different things.
      #
      # There is no floor on the total here, and that is deliberate rather
      # than an oversight: the number of tests a machine with no Postgres and
      # no Redis runs has never been measured on these runners, and a floor
      # invented rather than measured is the unverified claim this guard
      # exists to stop. `integration` carries the floor, because that is the
      # job whose count is known.
      - name: The driver was built, and the run proves it
        # LINUX ONLY, because the macOS leg above compile-checks the C rather
        # than linking a loadable module -- see the reason there -- so on
        # macOS "not built" is the true and expected answer, not a defect.
        if: runner.os == 'Linux'
        run: |
          if grep -E '^ok [0-9]+ - # SKIP' tap.txt | grep -Fi 'is not built'; then
            echo "::error::a spec skipped because akkar/pq_native.so was not" \
                 "found, even though the build step above reported success."
            exit 1
          fi
          echo "--- pending (expected: no Postgres, no Redis) ---"
          grep -E '^ok [0-9]+ - # SKIP' tap.txt | head -40 || true

      # WHY A DIAGNOSTIC RUNS IN CI AND CANNOT FAIL IT.
      #
      # `spec/determinism_spec.lua` asserts two seeded runs produce the same
      # trace, and on macOS they did not. Its assertion prints both traces and
      # nothing else, so it says THAT they differ and never HOW -- and three
      # hypotheses were killed on Linux without touching the cause, because
      # the machine with the problem was never asked.
      #
      # This step asks it. It reports the SHAPE of the difference: same set of
      # requests in a different order, or a request that vanished; which
      # position first diverges; how far a line moved; which routes are
      # involved. `|| true` because a diagnostic that can turn a build red is
      # a diagnostic somebody deletes.
      # `if: always()` because the run this report is FOR is the run where the
      # suite failed. Without it the step is skipped exactly when it would have
      # said something, which is what happened on its first outing.
      - name: Determinism report (informational)
        if: always()
        run: |
          lua5.4 -e 'require("spec.support.determinism_report").report(5)' || true

      # Exact, machine-independent, and the one number in `bench/` that
      # belongs in CI. Timing benchmarks do not: `bench/README.md` says
      # "nothing here runs in CI" and shared runners are why.
      - name: Allocation ceiling
        run: busted spec/allocation_spec.lua

      - name: The substrate contract
        run: busted spec/substrate_spec.lua

      - name: Doctor
        run: $LUA_BIN bin/akkar doctor --no-probe

  # ------------------------------------------------------------- lua 5.5
  # THE ROCKSPECS SAY `lua >= 5.4, < 5.6`. Until this job existed, nothing
  # tested the second half of that range.
  #
  # That is the failure mode this project keeps finding in itself: a claim
  # nobody re-measured. `spec/rockspec_spec.lua` even asserts the `< 5.6`
  # bound, so the declaration was locked down while the thing it declared was
  # never run. A version range CI does not exercise is a promise, not a fact.
  #
  # It is also how the macOS job broke on its first run: Homebrew's `lua`
  # formula had quietly become 5.5, the job became an accidental 5.5 probe,
  # and it failed on the vendored compat shim -- the same wall this job
  # deliberately walks through.
  #
  # WHY THIS RUNS A SCRIPT FROM `docs/` RATHER THAN INLINE STEPS. The recipe
  # is documentation and CI at once, on purpose. A documented build that CI
  # does not execute rots silently; an inline CI build that the docs merely
  # describe drifts the same way from the other side. One file, run by both,
  # cannot.
  #
  # NOT `continue-on-error`. A job allowed to fail is a job whose failure
  # nobody reads, which is the unverified claim again wearing a green tick.
  # If Lua 5.5 support breaks, this should stop the build and say so.
  #
  # First runs may well be red, and that is the point rather than a defect in
  # this file -- the same stance the matrix above takes with macOS. Every step
  # echoes what it resolved, so a break is diagnosable from the log.
  lua55:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl unzip libssl-dev libreadline-dev libpq-dev

      # Every layer is compiled from source, so this is minutes without a
      # cache and seconds with one. Keyed on the recipe itself: change the
      # script or the pinned commit and the cache is correctly abandoned.
      - name: Cache the 5.5 stack
        uses: actions/cache@v4
        with:
          path: ~/lua55
          key: lua55-${{ runner.os }}-${{ hashFiles('docs/runtime/lua55-stack.sh') }}-${{ env.CQUEUES_COMMIT }}

      - name: Build the Lua 5.5 stack
        run: LUA55_PREFIX=$HOME/lua55 bash docs/runtime/lua55-stack.sh

      - name: Point the environment at the prefix
        run: |
          echo "prefix : $HOME/lua55"
          echo "lua    : $HOME/lua55/bin/lua5.5"
          echo "path   : $PWD/?.lua;$HOME/lua55/share/lua/5.5/?.lua;;"
          echo "cpath  : $HOME/lua55/lib/lua/5.5/?.so;;"
          echo "LUA55=$HOME/lua55/bin/lua5.5" >> "$GITHUB_ENV"
          echo "LUA_PATH=$PWD/?.lua;$PWD/?/init.lua;$HOME/lua55/share/lua/5.5/?.lua;$HOME/lua55/share/lua/5.5/?/init.lua;;" >> "$GITHUB_ENV"
          echo "LUA_CPATH=$HOME/lua55/lib/lua/5.5/?.so;;" >> "$GITHUB_ENV"
          echo "$HOME/lua55/bin" >> "$GITHUB_PATH"

      # The assertion that keeps this job honest. Without it, a PATH that
      # happened to find the system Lua 5.4 would make this a duplicate of
      # `unit` reporting itself as 5.5 coverage -- exactly the accident the
      # macOS job had, in reverse.
      - name: It really is 5.5, and it really is the pinned cqueues
        run: |
          lua5.5 -v
          lua5.5 -e 'assert(_VERSION == "Lua 5.5", "got " .. _VERSION)'
          lua5.5 -e 'print("cqueues  " .. (require("cqueues").VERSION or "?"))'
          lua5.5 -e 'print("openssl  " .. require("openssl").version())'
          lua5.5 -e '
            local want = os.getenv("CQUEUES_COMMIT")
            local got  = require("cqueues").COMMIT
            assert(got, "cqueues has no COMMIT field: not the pinned build")
            assert(got == want, "cqueues is " .. got .. ", pinned is " .. want)
            print("commit   " .. got .. "  (pinned)")'

      # PARITY WITH THE `unit` JOB, which installs it the same best-effort way.
      #
      # Without this the 5.5 job runs six fewer tests than `unit` and the two
      # scoreboards differ for a reason that has nothing to do with Lua. Making
      # them run the same set means any difference between them IS a finding.
      # Both jobs now build `pq_native.so`, which is the other half of that
      # parity and used to be the sentence "Neither job builds
      # `pq_native.so`, so the C driver skips in both" -- an accurate
      # description of a hole, written down and left open.
      - name: Teal, best effort
        run: |
          luarocks --tree="$HOME/lua55" install tl \
            || echo "tl unavailable; spec/teal_spec.lua will report pending"

      # AND THIS IS THE JOB WHERE COMPILING IT MATTERS MOST.
      #
      # `src/akkar_pq.c` reaches for `lua_newuserdata`, `lua_getuservalue` and
      # `lua_setuservalue` -- three names that Lua 5.4 kept only as
      # compatibility macros over the `...uv` forms. If 5.5 ever drops them
      # the file stops compiling, and this is the only job that would find
      # out. The C itself already knows the stakes: it exports
      # `LUA_VERSION_NUM` because a module built for 5.4 loads into a 5.5
      # interpreter WITHOUT COMPLAINT and dumps core on the first real call --
      # which is how a 5.4 build left in the tree once segfaulted the whole
      # suite before it printed a line.
      #
      # So it is built here against the 5.5 headers and asserted to report
      # 505, which turns that comment from a story into a check.
      - name: Build the C Postgres driver against Lua 5.5
        run: |
          LUA_CFLAGS="-I$HOME/lua55/include" bash src/build.sh
          lua5.5 -e '
            package.cpath = "./?.so;" .. package.cpath
            local m = assert(require("akkar.pq_native"),
                             "akkar/pq_native.so did not load under 5.5")
            print("driver   " .. m.VERSION)
            assert(m.LUA_VERSION_NUM == 505,
                   "built for LUA_VERSION_NUM " .. m.LUA_VERSION_NUM ..
                   ", not 505: this is the 5.4 build, and it would dump core")
            print("built for 505, as it must be")'

      - name: The suite, under Lua 5.5
        run: |
          set -o pipefail
          busted --output=TAP | tee tap.txt

      # ------------------------------------------- the skip-is-green guard
      # THE BUILD STEP ABOVE CAN SUCCEED AND STILL NOT REACH THE TESTS.
      #
      # `src/build.sh` writes `akkar/pq_native.so`, and the specs find it only
      # because they prepend `./?.so` to `package.cpath` -- a different
      # working directory, a different OUT, a stale object, and the module is
      # missing again while every step in this job stays green. The specs
      # would then report the same tidy pending they reported for the entire
      # life of this file, which is exactly the signal that hid 582 lines of
      # uncompiled C.
      #
      # So the assertion is made against THE TEST RUN rather than the build:
      # this job has no Postgres, so the driver specs must skip -- but they
      # must skip saying "no Postgres here", never "not built". The two
      # sentences are one grep apart and mean completely different things.
      #
      # There is no floor on the total here, and that is deliberate rather
      # than an oversight: the number of tests a machine with no Postgres and
      # no Redis runs has never been measured on these runners, and a floor
      # invented rather than measured is the unverified claim this guard
      # exists to stop. `integration` carries the floor, because that is the
      # job whose count is known.
      - name: The driver was built, and the run proves it
        run: |
          if grep -E '^ok [0-9]+ - # SKIP' tap.txt | grep -Fi 'is not built'; then
            echo "::error::a spec skipped because akkar/pq_native.so was not" \
                 "found, even though the build step above reported success."
            exit 1
          fi
          echo "--- pending (expected: no Postgres, no Redis) ---"
          grep -E '^ok [0-9]+ - # SKIP' tap.txt | head -40 || true

      # 5.4 and 5.5 do not have to allocate identically, and if they diverge
      # the ceiling is where it shows. `spec/allocation_spec.lua` is exact
      # rather than statistical, so a difference here is a real difference.
      - name: Allocation ceiling
        run: busted spec/allocation_spec.lua

      - name: The substrate contract
        run: busted spec/substrate_spec.lua

      # `doctor` has a 5.5 branch of its own -- it passes with a note rather
      # than silently, because a 5.5 user did something deliberate. This is
      # the only place that branch is ever executed.
      - name: Doctor
        run: lua5.5 bin/akkar doctor --no-probe

  # --------------------------------------------------------- integration
  # The same suite with the backends up, so the specs that skip themselves on
  # a laptop actually run somewhere.
  integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: akkar
          POSTGRES_DB: akkar
        # 55432 because that is what the specs look for.
        ports: ["55432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lua5.4 liblua5.4-dev luarocks libssl-dev build-essential m4 \
            postgresql-client libpq-dev

      - name: Cache the cqueues build
        id: cqueues-cache
        uses: actions/cache@v4
        with:
          path: ~/cqueues-build
          key: cqueues-${{ env.CQUEUES_COMMIT }}-lua5.4-ubuntu-24.04

      - name: Build cqueues from the pinned commit
        if: steps.cqueues-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/wahern/cqueues.git ~/cqueues-build
          cd ~/cqueues-build
          git checkout "$CQUEUES_COMMIT"
          make all5.4 CPPFLAGS="-I/usr/include/lua5.4"

      - name: Install the rest of the dependencies
        run: |
          for rock in luaossl http lua-cjson pgmoon luasocket busted; do
            sudo luarocks --lua-version 5.4 install "$rock"
          done

      # Last, over the cqueues that `http` just pulled in, and with the
      # variable names cqueues actually reads. Same reasoning as the unit job,
      # including why `http` is in that list at all: it is the specs'
      # independent client, not a dependency of akkar.
      - name: Install the pinned cqueues, last, over the release rock
        run: |
          cd ~/cqueues-build
          # See the unit job: without this, `make install` finds the luarocks
          # files newer than the cached objects and copies nothing.
          sudo rm -f  /usr/local/lib/lua/5.4/_cqueues.so
          sudo rm -rf /usr/local/share/lua/5.4/cqueues.lua \
                      /usr/local/share/lua/5.4/cqueues
          sudo make install5.4 \
            lua54path=/usr/local/share/lua/5.4 \
            lua54cpath=/usr/local/lib/lua/5.4
          lua5.4 -e '
            local got = require("cqueues").COMMIT
            assert(got == os.getenv("CQUEUES_COMMIT"),
                   "cqueues is not the pinned build: " .. tostring(got))'

      # ------------------------------------------------- the C driver
      # THIS IS THE JOB THE DRIVER WAS ALWAYS FOR, and until now it did not
      # build it either. See the long note in the `unit` job for what that
      # cost. Here the module is not only compiled but EXERCISED: this is the
      # only job in the file with a Postgres, so it is the only place
      # `spec/pq_spec.lua`'s twelve cases and the second, `pq` pass of
      # `spec/db_spec.lua`'s twenty-five-case adapter contract can run at all.
      #
      # Same reasoning as the unit job for using `src/build.sh` rather than
      # `luarocks install akkar-pq`: the rockspec's `source.url` is
      # `git+... tag = "v0.1.0"`, so luarocks would compile the tagged
      # release's C rather than this checkout's, and its `akkar >= 0.1.0`
      # dependency can install a published `akkar` over the working tree. The
      # point of a pull request is to test the pull request.
      - name: Build the C Postgres driver
        run: |
          bash src/build.sh
          lua5.4 -e '
            package.cpath = "./?.so;" .. package.cpath
            local m = assert(require("akkar.pq_native"),
                             "akkar/pq_native.so did not load")
            print("driver   " .. m.VERSION)
            local maj, min = _VERSION:match("Lua (%d+)%.(%d+)")
            assert(m.LUA_VERSION_NUM == tonumber(maj) * 100 + tonumber(min),
                   "the driver was built for a different Lua than this one")'

      - name: Create the fixture the examples and specs expect
        env:
          PGPASSWORD: akkar
        run: |
          psql -h 127.0.0.1 -p 55432 -U postgres -d akkar <<'SQL'
          create table if not exists users (
            id serial primary key, name text not null, email text);
          insert into users (name, email) values
            ('ada','ada@example.com'), ('alan','alan@example.com')
          on conflict do nothing;
          SQL

      # `--output=TAP` rather than the default, because the next step has to
      # READ this run rather than trust its exit code. TAP is one anchored
      # line per test -- `ok N - name`, `not ok N - name`, and a pending as
      # `ok N - # SKIP name` -- which is greppable without a parser and does
      # not care that the specs also print application logs to stdout.
      - name: The suite, with the backends up
        run: |
          set -o pipefail
          busted --output=TAP | tee tap.txt

      # ---------------------------------------------- the skip-is-green guard
      # A GREEN TICK IS NOT EVIDENCE THAT ANYTHING RAN.
      #
      # Every skip guard in this suite is a `pending` behind a reachability
      # check, which is right on a laptop and is a hole in CI: a job where
      # Postgres failed to start, or where a build step silently produced no
      # module, skips the tests that needed them, reports pending, and exits
      # zero. The whole pipeline stays green while the thing it exists to
      # check is not executed. That is not a hypothetical -- `src/akkar_pq.c`
      # was compiled by nothing for the entire life of this file, and the only
      # reason CI never said so is that `spec/pq_spec.lua` skipped politely
      # and `spec/db_spec.lua` did not even do that.
      #
      # For a project whose rule is that every fix ships with an executable
      # proof, the proof going quiet has to be a red. So this job asserts
      # three things about the run it just did:
      #
      #   1. NOTHING SKIPPED FOR AN INFRASTRUCTURE REASON. This job supplies
      #      Postgres, Redis and a compiled driver, so a pending that names
      #      any of them is a broken job, not a portable spec.
      #   2. THE DRIVER TESTS ARE PRESENT BY NAME AND BY COUNT. A guard on
      #      pendings alone would not notice a spec file that stopped being
      #      collected, or a `describe` that returned early before registering
      #      anything -- which is precisely how the `pq` half of
      #      `spec/db_spec.lua` disappeared with no scoreboard entry.
      #   3. A FLOOR ON THE TOTAL. Deliberately a floor and not an equality:
      #      an equality is a chore on every added test and gets raised
      #      without being read. The floor only ever fires when a run gets
      #      substantially SMALLER, which is the failure this is for. Raise it
      #      when the suite has genuinely grown; never lower it to get green.
      - name: Nothing skipped for a reason this job exists to remove
        run: |
          ran=$(grep -cE '^ok [0-9]+ - ' tap.txt || true)
          skipped=$(grep -cE '^ok [0-9]+ - # SKIP' tap.txt || true)
          passed=$(( ran - skipped ))
          echo "passed  : $passed"
          echo "skipped : $skipped"

          if [ "$skipped" -gt 0 ]; then
            echo "--- pending ---"
            grep -E '^ok [0-9]+ - # SKIP' tap.txt || true
          fi

          fail=0

          # 1. Infrastructure-shaped pendings.
          if grep -E '^ok [0-9]+ - # SKIP' tap.txt \
             | grep -Ei 'postgres|redis|pq_native' ; then
            echo "::error::a test skipped because Postgres, Redis or the C driver" \
                 "was unavailable -- in the one job that provides all three."
            fail=1
          fi

          # 2. The C driver actually answered, rather than being merely built.
          #    Twelve cases in spec/pq_spec.lua and the twenty-five-case
          #    adapter contract replayed for `driver = "pq"` in spec/db_spec.lua.
          pq_unit=$(grep -cE '^ok [0-9]+ - akkar\.pq ' tap.txt || true)
          pq_contract=$(grep -cE '^ok [0-9]+ - driver pq ' tap.txt || true)
          echo "akkar.pq cases          : $pq_unit  (floor 12)"
          echo "adapter contract on pq  : $pq_contract  (floor 25)"
          [ "$pq_unit"     -ge 12 ] || { echo "::error::spec/pq_spec.lua did not run"; fail=1; }
          [ "$pq_contract" -ge 25 ] || { echo "::error::the pq pass of spec/db_spec.lua did not run"; fail=1; }

          # 3. The floor on the whole run.
          #
          # WHERE 560 COMES FROM: a full local run on 2026-09-02, with both
          # backends up and the driver built, passed 597 with nothing pending.
          # The integration runner has no `tl`, so `spec/teal_spec.lua` costs
          # a handful more. 560 is that number with room, chosen so the floor
          # fires on a spec file that stopped being collected and not on
          # ordinary churn. It is a measurement and not a guess, and the first
          # real run of this job is the thing that confirms it -- if it comes
          # in materially above 560, raise it to match what CI actually sees.
          MIN_PASSING=560
          echo "floor                   : $MIN_PASSING"
          if [ "$passed" -lt "$MIN_PASSING" ]; then
            echo "::error::$passed tests passed, below the floor of $MIN_PASSING." \
                 "Either the suite shrank or a spec file stopped being collected."
            fail=1
          fi

          exit "$fail"

  # -------------------------------------------------------------- install
  # The job that would have caught `bin/akkar` never being installed: the
  # rockspec has no `install.bin`, so the CLI the README documents as a shell
  # command does not ship. Nothing in the repository would ever have noticed,
  # because no documented flow installs the rock at all.
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lua5.4 liblua5.4-dev luarocks libssl-dev build-essential m4

      - name: Cache the cqueues build
        id: cqueues-cache
        uses: actions/cache@v4
        with:
          path: ~/cqueues-build
          key: cqueues-${{ env.CQUEUES_COMMIT }}-lua5.4-ubuntu-24.04

      - name: Build cqueues from the pinned commit
        if: steps.cqueues-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/wahern/cqueues.git ~/cqueues-build
          cd ~/cqueues-build
          git checkout "$CQUEUES_COMMIT"
          make all5.4 CPPFLAGS="-I/usr/include/lua5.4"

      - name: Lint the rockspec
        run: luarocks lint ./akkar-dev-1.rockspec

      - name: Install akkar from its own rockspec
        run: sudo luarocks --lua-version 5.4 make ./akkar-dev-1.rockspec

      # After the rockspec, which resolves cqueues as a dependency and would
      # otherwise move this aside. This job only runs the CLI, but a job that
      # tests installation should install what we say we install.
      - name: Install the pinned cqueues, last, over the release rock
        run: |
          cd ~/cqueues-build
          # See the unit job: without this, `make install` finds the luarocks
          # files newer than the cached objects and copies nothing.
          sudo rm -f  /usr/local/lib/lua/5.4/_cqueues.so
          sudo rm -rf /usr/local/share/lua/5.4/cqueues.lua \
                      /usr/local/share/lua/5.4/cqueues
          sudo make install5.4 \
            lua54path=/usr/local/share/lua/5.4 \
            lua54cpath=/usr/local/lib/lua/5.4
          lua5.4 -e '
            local got = require("cqueues").COMMIT
            assert(got == os.getenv("CQUEUES_COMMIT"),
                   "cqueues is not the pinned build: " .. tostring(got))'

      - name: Use the CLI from PATH, outside the source tree
        run: |
          cd /tmp
          akkar version
          akkar doctor --no-probe
