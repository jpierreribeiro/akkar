name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable vX.Y.Z tag to publish
        required: true
        type: string

permissions:
  contents: write
  actions: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Validate the immutable tag and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          SHA=$(git rev-parse HEAD)
          test "$(gh run list --workflow ci.yml --commit "$SHA" --status success --limit 1 --json databaseId --jq length)" -eq 1

      - name: Prepare source and LuaRocks artifacts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.4 luarocks
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          mkdir -p dist
          bash bin/prepare-release "$VERSION" dist
          git archive --format=tar.gz --prefix="akkar-$VERSION/" \
            -o "dist/akkar-$VERSION.tar.gz" HEAD

      - name: Build and publish the locked MLOps image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-ml-service"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$IMAGE:$VERSION" examples/mlops
          docker push "$IMAGE:$VERSION"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$VERSION" | cut -d@ -f2)" >> "$GITHUB_ENV"

      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/akkar-${{ env.VERSION }}.source.spdx.json
          upload-artifact: false

      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}:${{ env.VERSION }}
          format: spdx-json
          output-file: dist/akkar-${{ env.VERSION }}.ml-service.spdx.json
          upload-artifact: false

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Attest downloadable artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*

      - name: Attest the published image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag }}" dist/* --verify-tag --generate-notes
