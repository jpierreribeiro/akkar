version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, security]

  - package-ecosystem: pip
    directory: /examples/mlops
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, mlops]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, container]

  - package-ecosystem: docker
    directory: /examples/mlops
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, mlops]
