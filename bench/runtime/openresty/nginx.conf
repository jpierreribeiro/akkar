# OpenResty, matching bench/compare/akkar/serve.lua.
#
# The question only this candidate answers: how much does it cost NOT to have
# nginx in front? akkar's README says "no nginx in front" as a feature, and
# this is the number that says what that feature costs.
#
# TWO THINGS THAT CANNOT BE EQUALISED, both stated rather than buried:
#
# 1. This is LuaJIT. akkar is PUC Lua 5.4. That difference cannot be removed
#    and it is on every table -- it is also, separately, exactly what the
#    parked LuaJIT spike would price.
# 2. nginx is a C server with a Lua handler inside it. akkar is Lua all the
#    way down to cqueues. Comparing them is the point, not a flaw, but it is
#    not a like-for-like comparison of Lua code.
#
# `worker_processes` is set by run.sh to match every other candidate's process
# count. Left unset here on purpose: a config that quietly says `auto` is how
# a candidate ends up on twice the hardware threads, which this project has
# already published once by accident.

worker_processes 1;
daemon off;
error_log stderr error;
pid /tmp/rt-openresty.pid;

events {
    worker_connections 4096;
}

http {
    access_log off;
    lua_socket_log_errors off;

    # The same pool size every other candidate uses. A candidate with a bigger
    # pool is not faster, it is configured differently.
    lua_shared_dict unused 1m;

    # The SAME pgmoon akkar's default driver uses, from the same rock tree on
    # this box, rather than an OpenResty-specific copy. Rule 2: the database
    # client is not where a candidate gets to be different.
    lua_package_path "/home/ubuntu/.luarocks/share/lua/5.4/?.lua;/home/ubuntu/.luarocks/share/lua/5.4/?/init.lua;;";
    lua_package_cpath "/home/ubuntu/.luarocks/lib/lua/5.4/?.so;;";

    # NOT in init_by_lua_block. Requiring it at init makes /ping -- the route
    # that touches no database -- fail to start when the driver is missing,
    # which is how this candidate reported HTTP 000 on a route that needs
    # nothing. Loaded on first use instead, inside the route that uses it.
    lua_code_cache on;

    server {
        listen 8412 reuseport;
        server_name _;

        default_type application/json;

        location = /ping {
            content_by_lua_block {
                ngx.print('{"pong":true}')
            }
        }

        # Validation matches akkar's `v.integer { min = 1 }`: a non-integer or
        # an id below 1 is 422 before anything touches the database. A
        # candidate that skips validation is not faster, it is doing less.
        location ~ ^/users/(?<id>[^/]+)$ {
            content_by_lua_block {
                local raw = ngx.var.id
                local id = tonumber(raw)
                if not id or id ~= math.floor(id) or id < 1 then
                    ngx.status = 422
                    ngx.print('{"error":"invalid id"}')
                    return
                end

                local pgmoon = require "pgmoon"
                local pg = pgmoon.new {
                    host = "127.0.0.1", port = 55432,
                    database = "akkar", user = "postgres", password = "akkar",
                }
                local ok, err = pg:connect()
                if not ok then
                    ngx.status = 500
                    ngx.print('{"error":"' .. tostring(err) .. '"}')
                    return
                end

                local rows = pg:query(
                    "select id, name, email from users where id = " .. id)
                -- keepalive, so this measures the query and not TCP setup --
                -- the same thing akkar's pool is doing.
                pg:keepalive(0, 10)

                local row = rows and rows[1]
                if not row then
                    ngx.status = 404
                    ngx.print('{"error":"user not found"}')
                    return
                end

                ngx.print(require("cjson").encode {
                    id = row.id, name = row.name, email = row.email,
                })
            }
        }

        location / {
            content_by_lua_block {
                ngx.status = 404
                ngx.print('{"error":"no route for ' .. ngx.var.request_method
                          .. ' ' .. ngx.var.uri .. '"}')
            }
        }
    }
}
